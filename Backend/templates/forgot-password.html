<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Unique Fitness</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("https://www.shutterstock.com/image-photo/dumbbell-barbell-workout-gym-copy-260nw-1484912849.jpg");
    background-size: cover;
    background-position: center;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

.forgot-box {
    width: 320px;
    padding: 25px;

    background-color: white;
    border-radius: 15px;

    box-shadow: 0 0 20px black;
}

        h1 {

            text-align: center;

            color: red;

            margin-bottom: 15px;
        }

        p {

            color: #555;

            text-align: center;

            line-height: 1.5;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            margin-bottom: 20px;

            border: 1px solid gray;

            border-radius: 8px;
        }

        button {

            width: 100%;

            padding: 12px;

            background-color: orange;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background-color: red;

            color: white;
        }

        .login {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: red;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="forgot-box">

        <h1>FORGOT PASSWORD</h1>

        <p>
            Enter your registered email address.
            We will help you reset your password.
        </p>


        <form>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>


        <a href="login.html" class="login">
            ← Back to Login
        </a>

    </div>

</body>

</html>
