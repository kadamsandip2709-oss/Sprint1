<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Unique Fitness</title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #111;

            color: white;
        }

        nav {
            background-color: white;

            padding: 20px;

            text-align: center;
        }

        nav a {
            margin: 0 20px;

            text-decoration: none;

            color: black;

            font-weight: bold;
        }

        nav a:hover {
            color: red;
        }

        .contact {
            width: 400px;

            margin: 60px auto;

            padding: 30px;

            background-color: #222;

            border-radius: 15px;
        }

        h1 {
            text-align: center;

            color: orange;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            box-sizing: border-box;

            border-radius: 8px;

            border: none;
        }

        button {

            width: 100%;

            padding: 12px;

            background-color: orange;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background-color: red;

            color: white;
        }

    </style>

</head>

<body>

    
<nav>

    <a href="{% url 'home' %}">Home</a>

    <a href="{% url 'about' %}">About Us</a>

    <a href="{% url 'classes' %}">Classes</a>

    <a href="{% url 'contact' %}">Contact Us</a>

</nav>

    <div class="contact">

        <h1>CONTACT US</h1>

        <input
            type="text"
            placeholder="Your Name"
        >

        <input
            type="email"
            placeholder="Your Email"
        >

        <textarea
            rows="5"
            placeholder="Your Message">
        </textarea>

        <button>
            Send Message
        </button>

    </div>

</body>

</html>
