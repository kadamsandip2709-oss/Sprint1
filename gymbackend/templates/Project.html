<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Fitness</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("https://www.shutterstock.com/image-photo/dumbbell-barbell-workout-gym-copy-260nw-1484912849.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 60px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .photo {
            height: 50px;
            width: 60px;
        }

        h1 {
            color: red;
            margin-left: 10px;
            letter-spacing: 3px;
        }

        .menu {
            margin-left: auto;
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .menu a:hover {
            color: red;
        }

        h2 {
            margin: 120px 55px 10px;
            color: white;
            letter-spacing: 5px;
            line-height: 1.5;
            font-size: 40px;
        }

        p {
            color: yellow;
            margin: 0 55px 20px;
            letter-spacing: 1px;
            font-weight: bold;
            line-height: 1.6;
        }

        .join-btn {
            display: inline-block;
            margin-left: 55px;
            padding: 12px 25px;
            background-color: orange;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .join-btn:hover {
            background-color: red;
            color: white;
        }

        /* Gym Photos */

.gym-photos {
    margin-top: 80px;
    padding: 40px 55px;
    background-color: rgba(0, 0, 0, 0.75);
}

.gym-photos h2 {
    text-align: center;
    margin: 0 0 30px;
    color: orange;
    letter-spacing: 3px;
}

.photo-container {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.gym-card {
    width: 300px;
    background-color: white;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
}

.gym-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.gym-card h3 {
    color: black;
    margin: 15px;
}


.dashboard-btn {
    display: inline-block;
    padding: 15px 35px;
    background-color: orange;
    color: black;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
}

.dashboard-btn:hover {
    background-color: red;
    color: white;
}
    </style>
</head>

<body>

    <nav class="navbar">

        <img class="photo"
            src="https://img.magnific.com/premium-vector/fitness-gym-logo_642771-2840.jpg?semt=ais_hybrid&w=740&q=80">

        <h1>UNIQUE FITNESS</h1>

        <ul class="menu">

            <!-- CURRENT PAGE -->
            <li>
                <span class="active-home">Home</span>
            </li>

            <!-- NUTRITION -->
            <li>
                <a href="{% url 'nutrition' %}">Nutrition</a>
            </li>

            <!-- ABOUT -->
            <li>
                <a href="{% url 'about' %}">About</a>
            </li>

            <!-- LOGOUT -->
            <li>
                <a href="{% url 'logout' %}">Logout</a>
            </li>

        </ul>

    </nav>


    <h2>
        TRANSFORM YOUR
        <br>
        BODY NOW!
    </h2>


    <p>
        Personalized training, Modern equipment
        <br>
        and Guaranteed results.
    </p>


    <a href="{% url 'dashboard' %}" class="dashboard-btn">
        VISIT DASHBOARD
    </a>


    <!-- Gym Photos Section -->

    <section class="gym-photos">

        <h2>OUR GYM</h2>

        <div class="photo-container">

            <div class="gym-card">

                <img
                    src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80"
                    alt="Gym Equipment">

                <h3>Modern Equipment</h3>

            </div>


            <div class="gym-card">

                <img
                    src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?auto=format&fit=crop&w=600&q=80"
                    alt="Fitness Gym">

                <h3>Professional Gym</h3>

            </div>


            <div class="gym-card">

                <img
                    src="https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=600&q=80"
                    alt="Workout Training">

                <h3>Personal Training</h3>

            </div>

        </div>

    </section>


</body>
</html>
